<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control BLE Carro</title>
  <!-- Favicon integrado en Base64 para eliminar el error 404 de la consola -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }
    header { margin-bottom: 10px; }
    .btn {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 12px;
      margin: 5px;
      cursor: pointer;
      touch-action: none;
    }
    .btn:active, .btn.pressed { background-color: #0056b3; }
    .btn-connect { background-color: #28a745; margin-bottom: 20px; }
    .btn-connect.connected { background-color: #dc3545; }
    .control-grid {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 10px;
      justify-content: center;
    }
    .btn-nav { font-size: 2rem; padding: 0; touch-action: none; }
    #status { color: #aaa; margin-top: 10px; font-size: 0.9rem; text-align: center; }
  </style>
</head>
<body>

  <header>
    <button id="connectBtn" class="btn btn-connect">Conectar Carro</button>
  </header>

  <!-- Control de dirección estilo cruceta -->
  <div class="control-grid">
    <div></div>
    <button class="btn btn-nav" data-dir="F">▲</button>
    <div></div>

    <button class="btn btn-nav" data-dir="L">◀</button>
    <button class="btn btn-nav" style="background-color:#444;" id="stopBtn">🛑</button>
    <button class="btn btn-nav" data-dir="R">▶</button>

    <div></div>
    <button class="btn btn-nav" data-dir="B">▼</button>
    <div></div>
  </div>

  <div id="status">Desconectado</div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(function (err) {
        console.error('No se pudo registrar el service worker:', err);
      });
    }

    // Parámetros exactos tomados de tu script MicroPython
    const BLE_DEVICE_NAME = 'ESP32-BLE';
    const SERVICE_UUID = 0x181A;
    const TX_CHARACTERISTIC_UUID = 0x2A6E;

    let deviceBLE = null;
    let txCharacteristic = null;
    let currentDir = null;
    let sendInterval = null; // Bucle para mantener activo el ESP32 (< 500ms)

    const connectBtn = document.getElementById('connectBtn');
    const statusText = document.getElementById('status');
    const stopBtn = document.getElementById('stopBtn');
    const dirButtons = document.querySelectorAll('.btn-nav[data-dir]');

    connectBtn.addEventListener('click', async () => {
      if (deviceBLE && deviceBLE.gatt.connected) {
        deviceBLE.gatt.disconnect();
        return;
      }

      if (!navigator.bluetooth) {
        statusText.innerText = 'Navegador no compatible con Web Bluetooth (usa Chrome/Edge sobre HTTPS).';
        return;
      }

      try {
        statusText.innerText = 'Buscando carro...';
        
        // Filtramos por el nombre exacto 'ESP32-BLE'
        deviceBLE = await navigator.bluetooth.requestDevice({
          filters: [{ name: BLE_DEVICE_NAME }],
          optionalServices: [SERVICE_UUID]
        });

        statusText.innerText = 'Conectando al servidor GATT...';
        const server = await deviceBLE.gatt.connect();

        statusText.innerText = 'Obteniendo servicio...';
        const service = await server.getPrimaryService(SERVICE_UUID);

        statusText.innerText = 'Obteniendo característica...';
        txCharacteristic = await service.getCharacteristic(TX_CHARACTERISTIC_UUID);

        statusText.innerText = '¡Carro Conectado!';
        connectBtn.innerText = 'Desconectar';
        connectBtn.classList.add('connected');

        deviceBLE.addEventListener('gattserverdisconnected', onDisconnected);
      } catch (error) {
        console.error(error);
        statusText.innerText = 'Error: ' + error.message;
      }
    });

    function onDisconnected() {
      statusText.innerText = 'Desconectado';
      connectBtn.innerText = 'Conectar Carro';
      connectBtn.classList.remove('connected');
      txCharacteristic = null;
      stopLoop();
      dirButtons.forEach(b => b.classList.remove('pressed'));
    }

    async function sendCmd(command) {
      if (!txCharacteristic) return;
      try {
        const encoder = new TextEncoder();
        await txCharacteristic.writeValue(encoder.encode(command));
      } catch (error) {
        console.error('Error enviando comando:', error);
      }
    }

    // Bucle para enviar el comando cada 150ms y vencer el timeout de 500ms de MicroPython
    function startLoop(dir) {
      if (sendInterval) clearInterval(sendInterval);
      sendCmd(dir); // Envío inmediato
      sendInterval = setInterval(() => {
        sendCmd(dir);
      }, 150);
    }

    function stopLoop() {
      if (sendInterval) {
        clearInterval(sendInterval);
        sendInterval = null;
      }
      currentDir = null;
      sendCmd('S'); // Enviar Stop inmediatamente
    }

    function press(dir, btn) {
      currentDir = dir;
      btn.classList.add('pressed');
      startLoop(dir);
    }

    function release(btn) {
      if (currentDir === null) return;
      btn.classList.remove('pressed');
      stopLoop();
    }

    dirButtons.forEach(btn => {
      const dir = btn.dataset.dir;

      btn.addEventListener('touchstart', (e) => { e.preventDefault(); press(dir, btn); }, { passive: false });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); release(btn); }, { passive: false });
      btn.addEventListener('touchcancel', (e) => { e.preventDefault(); release(btn); }, { passive: false });

      btn.addEventListener('mousedown', () => press(dir, btn));
      btn.addEventListener('mouseup', () => release(btn));
      btn.addEventListener('mouseleave', () => release(btn));
    });

    stopBtn.addEventListener('click', () => {
      dirButtons.forEach(b => b.classList.remove('pressed'));
      stopLoop();
    });
  </script>
</body>
</html>
